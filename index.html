    <style>
/* Splash: every animation here is opacity/transform only, so the phone's GPU runs it
   and it stays smooth even while the app's code is loading in the background. */
html, body { margin: 0; background: #000; }
/* The app stays hidden until the splash starts fading, so it can never flash through mid-animation */
html.booting #root { visibility: hidden; }
.splash {
  position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; overflow: hidden;
  background: #000; transition: opacity 320ms ease;
}
.splash::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse 70% 45% at 50% 48%, #1d0f3a 0%, #0a0612 55%, #000 100%);
  animation: splash-fade 450ms ease-out both; will-change: opacity;
}
.splash.leaving { opacity: 0; pointer-events: none; }

.splash-glow {
  position: absolute; width: 520px; height: 520px; border-radius: 50%;
  background: radial-gradient(circle, rgba(123, 47, 247, 0.45), transparent 62%);
  animation: splash-glow-in 700ms ease-out both, splash-pulse 600ms ease-out 1150ms both; will-change: transform, opacity;
}
.splash-stage { position: relative; display: flex; flex-direction: column; align-items: center; }
.splash-wordwrap { position: relative; width: min(68vw, 300px); }
.splash-word {
  position: relative; width: 100%; height: auto; display: block; transform: translateZ(0);
  animation: splash-word-in 560ms cubic-bezier(0.2, 0.8, 0.2, 1) both, splash-word-pop 420ms ease-out 1150ms both;
  will-change: transform, opacity;
}
/* soft purple bloom behind the word that flares when the drop lands */
.splash-bloom {
  position: absolute; left: 8%; right: 8%; top: 18%; bottom: 18%; border-radius: 50%;
  background: radial-gradient(ellipse, rgba(155, 92, 255, 0.75), rgba(123, 47, 247, 0) 70%);
  opacity: 0; animation: splash-bloom 650ms ease-out 1150ms both; will-change: transform, opacity;
}

/* the drop: a teardrop that beads under the word, stretches, then falls */
.splash-drop {
  position: absolute; left: 50%; top: 92%; width: 18px; height: 18px; margin-left: -9px;
  background: linear-gradient(180deg, #e2d0ff, #9b5cff);
  border-radius: 0 50% 50% 50%; transform: rotate(45deg) scale(0); transform-origin: 50% 50%;
  box-shadow: 0 0 14px rgba(155, 92, 255, 0.9);
  animation: splash-drop 820ms cubic-bezier(0.5, 0, 0.75, 0) 380ms both; will-change: transform, opacity;
}
.splash-ripple {
  position: absolute; left: 50%; top: calc(92% + 96px); width: 22px; height: 7px; margin-left: -11px;
  border: 2px solid rgba(183, 140, 255, 0.9); border-radius: 50%; opacity: 0;
  animation: splash-ripple 650ms ease-out 1150ms forwards; will-change: transform, opacity;
}
.splash-ripple.r2 { animation-delay: 1260ms; border-color: rgba(155, 92, 255, 0.6); }

@keyframes splash-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes splash-glow-in { from { opacity: 0; transform: scale(0.7); } to { opacity: 1; transform: scale(1); } }
@keyframes splash-pulse { 0% { transform: scale(1); } 40% { transform: scale(1.18); opacity: 1; } 100% { transform: scale(1); opacity: 0.85; } }
@keyframes splash-word-in { from { opacity: 0; transform: translateZ(0) scale(0.9); } to { opacity: 1; transform: translateZ(0) scale(1); } }
@keyframes splash-word-pop { 0% { transform: translateZ(0) scale(1); } 35% { transform: translateZ(0) scale(1.045); } 100% { transform: translateZ(0) scale(1); } }
@keyframes splash-bloom { 0% { opacity: 0; transform: scale(0.8); } 35% { opacity: 0.9; transform: scale(1.1); } 100% { opacity: 0.35; transform: scale(1); } }
@keyframes splash-drop {
  0% { transform: translateY(0) rotate(45deg) scale(0); opacity: 1; }
  45% { transform: translateY(2px) rotate(45deg) scale(1); }
  60% { transform: translateY(8px) rotate(45deg) scale(1.05, 1.15); }
  97% { transform: translateY(96px) rotate(45deg) scale(0.9, 1.2); opacity: 1; }
  100% { transform: translateY(100px) rotate(45deg) scale(0); opacity: 0; }
}
@keyframes splash-ripple { 0% { opacity: 0.95; transform: scale(0.4); } 100% { opacity: 0; transform: scale(7, 4.5); } }

@media (prefers-reduced-motion: reduce) {
  .splash::before, .splash-glow, .splash-word, .splash-bloom, .splash-drop, .splash-ripple { animation: none; }
  .splash-drop, .splash-ripple, .splash-bloom { display: none; }
}

    <script>
      // The splash is plain HTML so it's on screen from the first frame (no flash while the app loads).
      // It leaves once the animation has played AND the app is ready underneath.
      (function () {
        var el = document.getElementById('boot-splash');
        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        var minMs = reduce ? 600 : 2350, start = Date.now(), appReady = false, gone = false;
        function finish() {
          if (gone) return;
          gone = true;
          document.documentElement.classList.remove('booting');
          requestAnimationFrame(function () { el.classList.add('leaving'); });
          setTimeout(function () { el.remove(); }, 380);
        }
        function check() {
          if (!appReady) return;
          var wait = minMs - 300 - (Date.now() - start);
          if (wait > 0) setTimeout(finish, wait); else finish();
        }
        window.__sweatrReady = function () { if (!appReady) { appReady = true; check(); } };
        setTimeout(finish, 8000); // never get stuck
      })();
    </script>
